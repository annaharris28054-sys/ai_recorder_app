name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create asset dirs
        run: |
          mkdir -p ai_recorder_app/assets/models
          mkdir -p ai_recorder_app/assets/icons
          touch ai_recorder_app/assets/models/.gitkeep
          touch ai_recorder_app/assets/icons/.gitkeep

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        working-directory: ai_recorder_app
        run: flutter create . --project-name ai_recorder_app

      - name: Get dependencies
        working-directory: ai_recorder_app
        run: flutter pub get

      - name: Generate Isar code
        working-directory: ai_recorder_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: ai_recorder_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ai_recorder_app/build/app/outputs/flutter-apk/app-debug.apk
